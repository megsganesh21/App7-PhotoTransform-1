        /* detectVerticalSquash & drawImageIOSFix = are functions that are critical due to a flaw in the iPhone camera software that squishes any photo
        */
        function detectVerticalSquash(img) {
            var iw = img.naturalWidth, ih = img.naturalHeight; // Get width and height
            var canvas = document.createElement('canvas'); // Creates a temporary canvas that will be used as template
            canvas.width = 1; // Only 1 pixel wide
            canvas.height = ih; // Full height
            var ctx = canvas.getContext('2d'); // Get context
            ctx.drawImage(img, 0, 0);  // Draw image to temp canvas
            var data = ctx.getImageData(0, 0, 1, ih).data; // Get image data
            var sy = 0;
            var ey = ih;
            var py = ih;
            while (py > sy) {
                var alpha = data[(py - 1) * 4 + 3];
                if (alpha === 0) {
                    ey = py;
                }
                else {
                    sy = py;
                }
                py = (ey + sy) >> 1;
            }
            var ratio = (py / ih);
            return (ratio===0)?1:ratio; // Return ratio for scaling fix
        }
        // Fix drawing squished images on iOS using vertical squash ratio
        function drawImageIOSFix(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) { // Detect vertical squash
            var vertSquashRatio = detectVerticalSquash(img);
            ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / vertSquashRatio); // Draw image with corrected height
        }

        /* window.onload necessary to keep javascripts from running before the app gets a chance to load entirely. */
        window.onload = function() {
            var fileInput = document.getElementById('fileInput');
            var messageDisplayArea = document.getElementById('messageDisplayArea');
            /* fileInput.addEventListener looks for any change in the <input> tag indicating that the user has selected a file (picture). */
            fileInput.addEventListener('change', function(e) {
                var file = fileInput.files[0];
                var imageType = /image.*/;
                /* if (file.type.match(imageType)) checks that the selected file is indeed an image. */
                if (file.type.match(imageType)) {
                    /* they start a file reading process her to understand the image */
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        /* messageDisplayArea.innerHTML not needed but allows you to send a message at this point in the program. */
                        messageDisplayArea.innerHTML = "You picked an image!";
                        /* not really sure what this does but it like waits for the imafe to load?  */
                        var img = new Image();
                        img.onload = function() {
                            /*This finally draws the image onto the first drawing canvas. The specific canvas is referred to by "context". This is established
                            */
                            drawImageIOSFix(context, img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, 600, 500);

                            /* +++++++++++++++ BEGIN IMAGE PROCESSING +++++++++++++++ */
                            /* ++++++++++++++++++++++++++++++++++++++++++++++++++++++ */

                            /* PUT ANY CHANGES TO THE JAVASCRIPT HERE  */

                            // Get image data (pixel info) from the original canvas
                            var imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                            var data = imageData.data; // Pixel data is in a 1D array
                            // Get the second canvas and its context
                            var canvas2 = document.getElementById('dataCanvas');
                            var context2 = canvas2.getContext("2d");
                            // Create a new blank imageData object for the second canvas
                            var blueImage = context2.createImageData(canvas2.width, canvas2.height);
                            var blueData = blueImage.data;
                            // Loop through each pixel in the image (4 values per pixel: R, G, B, A)
                            for (var i = 0; i < data.length; i += 4) {
                                var blue = data[i + 2]; // ONLY taking out the blue pixels
                            // builds new pixels with the orignal blue = this removes all but blue
                                blueData[i] = 0;         // Red channel = 0
                                blueData[i + 1] = 0;     // Green channel = 0
                                blueData[i + 2] = blue;  // Blue channel = original blue value
                                blueData[i + 3] = 255;   // Alpha channel = fully opaque
                            }
                            // Draw the blue-only image onto the second canvas
                            context2.putImageData(blueImage, 0, 0);

                            // End of img.onload
                        }
                        img.src = reader.result;
                    } //  end of reader.onload

                    reader.readAsDataURL(file);
                } // end of the if statement checking that file is an image
                else
                {
                    // this is what happens if the orignial file selected is not an image file
                    messageDisplayArea.innerHTML = "File not supported!";
                } // end of the else statement if file in NOT an image
            }); // end of the fileInput.addEventListener function
        } // end of the window.onload function
